<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗预约系统</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<!-- 1. 角色选择页 -->
<div id="roleSelectPage" class="page">
    <div class="container">
        <h1>🏥 医疗预约系统</h1>
        <p class="subtitle">请选择您的角色</p>
        <div class="role-buttons">
            <button class="role-btn patient" onclick="goToLogin('patient')">👤 患者</button>
            <button class="role-btn doctor" onclick="goToLogin('doctor')">👨‍⚕️ 医生</button>
        </div>
    </div>
</div>

<!-- 2. 登录页 -->
<div id="loginPage" class="page" style="display: none;">
    <div class="container">
        <h2 id="loginTitle">患者登录</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>手机号/工号</label>
                <input type="text" id="loginUsername" placeholder="请输入手机号/工号" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="code-input">
                    <input type="text" id="loginCode" placeholder="请输入验证码" required>
                    <button type="button" class="code-btn" onclick="sendCode()">获取验证码</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">登录</button>
        </form>
        <div class="link-group">
            <button class="link-btn" onclick="goToRegister()">没有账号？去注册</button>
            <button class="back-btn" onclick="goToRoleSelect()">← 返回角色选择</button>
        </div>
    </div>
</div>

<!-- 3. 注册页 -->
<div id="registerPage" class="page" style="display: none;">
    <div class="container">
        <h2 id="registerTitle">患者注册</h2>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="regPhone" placeholder="请输入手机号" required>
            </div>
            <div class="form-group">
                <label>设置密码</label>
                <input type="password" id="regPassword" placeholder="请设置密码（不少于6位）" required minlength="6">
            </div>
            <button type="submit" class="submit-btn">注册</button>
        </form>
        <div class="link-group">
            <button class="link-btn" onclick="goToLoginFromRegister()">已有账号？去登录</button>
            <button class="back-btn" onclick="goToLoginFromRegister()">← 返回登录</button>
        </div>
    </div>
</div>

<!-- 4. 主页面（登录成功后进入） -->
<div id="mainPage" class="page" style="display: none;">
    <header class="header">
        <div class="logo">🏥 医疗预约系统</div>
        <div class="user-info">
            <span id="userName">用户</span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </header>
    <nav class="nav">
        <button class="nav-btn active" onclick="switchModule('appointment')">预约挂号</button>
        <button class="nav-btn" onclick="switchModule('payment')">缴费管理</button>
        <button class="nav-btn" onclick="switchModule('message')">消息通知</button>
        <button class="nav-btn doctor-only" onclick="switchModule('doctorManage')">医生管理</button>
    </nav>
    <main class="main-content">
        <!-- 预约模块 -->
        <div id="appointmentModule" class="module active">
            <h2>预约挂号</h2>
            <div class="form">
                <div class="form-group">
                    <label>选择科室</label>
                    <select id="deptSelect" onchange="loadDoctors()">
                        <option value="">请选择科室</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>选择医生</label>
                    <select id="doctorSelect" onchange="loadPeriods()">
                        <option value="">请选择医生</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>预约日期</label>
                    <input type="date" id="appointDate" onchange="loadPeriods()">
                </div>
                <div class="form-group">
                    <label>预约时段</label>
                    <div id="periodOptions" class="period-grid"></div>
                </div>
                <button class="submit-btn" onclick="submitAppointment()">提交预约</button>
            </div>
            <h3>我的预约</h3>
            <div id="myAppointments" class="list-container"></div>
        </div>

        <!-- 缴费模块 -->
        <div id="paymentModule" class="module">
            <h2>缴费管理</h2>
            <div id="patientPayment">
                <h3>待缴费订单</h3>
                <div id="waitPayList" class="list-container"></div>
                <h3>缴费记录</h3>
                <div id="payHistoryList" class="list-container"></div>
            </div>
            <div id="doctorPayment" style="display: none;">
                <div class="form">
                    <h3>开立缴费单</h3>
                    <div class="form-group">
                        <label>预约ID</label>
                        <input type="text" id="billAppointmentId" placeholder="请输入预约ID">
                    </div>
                    <div class="form-group">
                        <label>费用项目</label>
                        <input type="text" id="billItems" placeholder="如：挂号费、诊疗费">
                    </div>
                    <div class="form-group">
                        <label>总金额</label>
                        <input type="number" id="billAmount" placeholder="请输入金额">
                    </div>
                    <button class="submit-btn" onclick="createBill()">开立缴费单</button>
                </div>
            </div>
        </div>

        <!-- 消息模块 -->
        <div id="messageModule" class="module">
            <h2>消息通知</h2>
            <div class="tab-group">
                <button class="tab-btn active" onclick="loadMessages('all')">全部消息</button>
                <button class="tab-btn" onclick="loadMessages('unread')">未读消息</button>
            </div>
            <div id="messageList" class="list-container"></div>
        </div>

        <!-- 医生管理模块 -->
        <div id="doctorManageModule" class="module">
            <h2>医生管理</h2>
            <div class="tab-group">
                <button class="tab-btn active" onclick="switchDoctorTab('leave')">请假管理</button>
                <button class="tab-btn" onclick="switchDoctorTab('bill')">开缴费单</button>
            </div>
            <div id="leaveTab" class="doctor-tab active">
                <div class="form">
                    <h3>申请请假</h3>
                    <div class="form-group">
                        <label>请假类型</label>
                        <select id="leaveType">
                            <option value="normal">常规请假</option>
                            <option value="emergency">紧急请假</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>开始日期</label>
                        <input type="date" id="leaveStart">
                    </div>
                    <div class="form-group">
                        <label>结束日期</label>
                        <input type="date" id="leaveEnd">
                    </div>
                    <button class="submit-btn" onclick="applyLeave()">提交申请</button>
                </div>
                <h3>请假记录</h3>
                <div id="leaveList" class="list-container"></div>
            </div>
            <div id="billTab" class="doctor-tab">
                <div class="form">
                    <h3>开立缴费单</h3>
                    <div class="form-group">
                        <label>预约ID</label>
                        <input type="text" id="docBillAppId" placeholder="请输入预约ID">
                    </div>
                    <div class="form-group">
                        <label>费用项目</label>
                        <input type="text" id="docBillItems" placeholder="请输入费用项目">
                    </div>
                    <div class="form-group">
                        <label>总金额</label>
                        <input type="number" id="docBillAmount" placeholder="请输入金额">
                    </div>
                    <button class="submit-btn" onclick="docCreateBill()">开立缴费单</button>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
