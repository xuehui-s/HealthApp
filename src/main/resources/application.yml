# ============================================================
# HealthApp 企业级智慧医疗系统 - 主配置文件
# ============================================================
server:
  port: 8081
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 10000

spring:
  application:
    name: healthapp-service

  # ==================== 环境切换 ====================
  profiles:
    active: dev

  # ==================== 数据源（读写分离准备） ====================
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/healthapp2?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:123456}
        slave:
          url: jdbc:mysql://localhost:3306/healthapp2?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:123456}
      hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 10000

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ==================== RabbitMQ ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  # ==================== JSON序列化 ====================
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # ==================== 文件上传 ====================
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

  # ==================== 缓存 ====================
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

# ==================== MyBatis-Plus ====================
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath*:mapper/**/*.xml

# ==================== SpringDoc OpenAPI ====================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 患者端
      paths-to-match: /api/v1/patient/**
    - group: 医生端
      paths-to-match: /api/v1/doctor/**
    - group: 管理端
      paths-to-match: /api/v1/admin/**
    - group: AI Agent
      paths-to-match: /api/v1/agent/**
    - group: 公共接口
      paths-to-match: /api/v1/common/**, /api/v1/auth/**

# ==================== Actuator 监控 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ==================== Nacos 服务注册 ====================
spring.cloud.nacos:
  discovery:
    server-addr: ${NACOS_ADDR:localhost:8848}
    namespace: healthapp
    group: HEALTHAPP_GROUP
    enabled: false  # 本地开发关闭，生产环境开启
  config:
    server-addr: ${NACOS_ADDR:localhost:8848}
    namespace: healthapp
    group: HEALTHAPP_GROUP
    file-extension: yaml
    enabled: false

# ==================== Sentinel 熔断限流 ====================
spring.cloud.sentinel:
  transport:
    dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
    port: 8719
  eager: true
  enabled: false  # 本地开发关闭

# ==================== XXL-Job 分布式任务调度 ====================
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://localhost:9090/xxl-job-admin}
    executor:
      appname: healthapp-executor
      address:
      ip:
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 30
    enabled: false

# ==================== 业务配置 ====================
app:
  jwt:
    secret: ${JWT_SECRET:mySecretKey123456789012345678901234}
    expiration-days: 7
    sliding-expiration-minutes: 30
  payment:
    expire-hour: 23
    delay-days: 1
  ai:
    result-expire: 3600
  agent:
    url: ${AGENT_URL:http://localhost:8000}

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    it.guowei.healthapp: DEBUG
    org.springframework.security: WARN
    org.springframework.cloud.alibaba: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
